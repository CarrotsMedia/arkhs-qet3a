version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: arkhsly-postgres
    environment:
      POSTGRES_USER: arkhsly_admin
      POSTGRES_PASSWORD: arkhsly_secure_pass
      POSTGRES_DB: arkhsly_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
